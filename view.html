<body>

    <main role="main">
        <div id="container" tabindex="10" aria-label="3D场景查看器" title="Shadow Editor 3D场景查看器" class="player"></div>

    <!-- shaders -->

    <!-- objects -->
    <script src="assets/js/objects/Sky.js"></script>
    <script src="assets/js/objects/Reflector.js"></script>
    <script src="assets/js/objects/Lensflare.js"></script>

    <!-- Shadow Editor -->
    <script src="build/ShadowEditor.js"></script>
    <script>
        let app = null;

        const getQueryString = name => {
            var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)', 'i');
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return unescape(r[2]);
            return null;
        };

        // 动态更新页面元数据的函数
        const updateMetadata = (sceneData) => {
            try {
                const sceneName = sceneData.metadata && sceneData.metadata.name ? sceneData.metadata.name : '3D场景';
                const sceneDescription = sceneData.metadata && sceneData.metadata.description ? sceneData.metadata.description : '使用 Shadow Editor 创建的交互式3D场景';

                // 更新页面标题
                document.title = `${sceneName} - Shadow Editor 3D场景查看器`;

                // 更新描述
                const descriptionMeta = document.querySelector('meta[name="description"]');
                if (descriptionMeta) {
                    descriptionMeta.setAttribute('content', `在线查看${sceneName}：${sceneDescription}`);
                }

                // 更新 Open Graph 标题
                const ogTitle = document.querySelector('meta[property="og:title"]');
                if (ogTitle) {
                    ogTitle.setAttribute('content', `${sceneName} - Shadow Editor 3D场景`);
                }

                // 更新 Open Graph 描述
                const ogDescription = document.querySelector('meta[property="og:description"]');
                if (ogDescription) {
                    ogDescription.setAttribute('content', sceneDescription);
                }

                // 更新 Twitter 标题
                const twitterTitle = document.querySelector('meta[name="twitter:title"]');
                if (twitterTitle) {
                    twitterTitle.setAttribute('content', `${sceneName} - Shadow Editor 3D场景`);
                }

                // 更新 Twitter 描述
                const twitterDescription = document.querySelector('meta[name="twitter:description"]');
                if (twitterDescription) {
                    twitterDescription.setAttribute('content', sceneDescription);
                }

                // 更新 Open Graph URL
                const currentUrl = window.location.href;
                const ogUrl = document.querySelector('meta[property="og:url"]');
                if (ogUrl) {
                    ogUrl.setAttribute('content', currentUrl);
                }

                // 更新 Twitter URL
                const twitterUrl = document.querySelector('meta[name="twitter:url"]');
                if (twitterUrl) {
                    twitterUrl.setAttribute('content', currentUrl);
                }

                // 更新结构化数据
                updateStructuredData(sceneName, sceneDescription, currentUrl);
            } catch (error) {
                console.error('Failed to update metadata:', error);
            }
        };

        // 更新结构化数据
        const updateStructuredData = (sceneName, sceneDescription, url) => {
            try {
                const scriptTag = document.querySelector('script[type="application/ld+json"]');
                if (scriptTag) {
                    const structuredData = JSON.parse(scriptTag.textContent);
                    structuredData.name = `${sceneName} - 3D场景查看器`;
                    structuredData.description = sceneDescription;
                    structuredData.url = url;
                    scriptTag.textContent = JSON.stringify(structuredData);
                }
            } catch (error) {
                console.error('Failed to update structured data:', error);
            }
        };

        const start = () => {
            app = new Shadow.Player(document.querySelector('#container'), {
                server: '.',
                enableThrowBall: false,
            });

            const sceneID = getQueryString('sceneID');
            const sceneFile = getQueryString('sceneFile');

            if (sceneID) { // 通过/api/Scene/Load?ID=sceneID获取场景数据
                fetch(`${app.options.server}/api/Scene/Load?ID=${sceneID}`).then(response => {
                    if (response.ok) {
                        response.json().then(json => {
                            if (json.Code === 200) {
                                const sceneData = json.Data;
                                // 动态更新页面元数据
                                updateMetadata(sceneData);
                                app.start(JSON.stringify(sceneData));
                            }
                        });
                    }
                });
            } else if (sceneFile) { // 通过/Scene/sceneID.txt获取场景数据（导出用）
                fetch(`${app.options.server}/Scene/${sceneFile}.txt`).then(response => {
                    if (response.ok) {
                        response.json().then(json => {
                            // 动态更新页面元数据
                            updateMetadata(json);
                            app.start(JSON.stringify(json));
                        });
                    }
                });
            } else {
                alert('Lack sceneID or sceneFile query params, scene load failed.');
            }
        };

        window.onload = start;
    </script>
</body>
